openapi: 3.1.0
info:
  title: SMPG API (Send Money Payment Gateway)
  version: 0.1.0
  description: >-
    Lightweight, multi-tenant payment gateway API for bKash, Nagad, and Cash on Delivery (COD).
servers:
  - url: http://localhost:8787
    description: Local development worker
  - url: https://smpg-core.{account}.workers.dev
    description: Cloudflare Worker production base URL
    variables:
      account:
        default: your-account

paths:
  /v1/payments:
    post:
      summary: Create a payment
      description: Creates a new payment session and returns a hosted checkout URL.
      operationId: createPayment
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
          required: false
          description: Unique request key to prevent duplicate payment creations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      summary: List payments
      description: Lists payments with optional filters.
      operationId: listPayments
      security:
        - BearerAuth: []
      parameters:
        - name: external_order_id
          in: query
          schema:
            type: string
          required: false
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
          required: false
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          required: false
        - name: cursor
          in: query
          schema:
            type: string
          required: false
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  has_more:
                    type: boolean

  /v1/payments/{id}:
    get:
      summary: Retrieve a payment
      operationId: getPayment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/payments/{id}/cancel:
    post:
      summary: Cancel a payment
      operationId: cancelPayment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/payments/{id}/method:
    post:
      summary: Set or change payment method
      description: Sets payment method (bkash, nagad, or cod) on a CREATED payment and allocates an active wallet.
      operationId: setPaymentMethod
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  $ref: '#/components/schemas/PaymentMethod'
      responses:
        '200':
          description: Payment method updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/payments/{id}/submit:
    post:
      summary: Submit customer TrxID via authenticated API
      description: Submits TrxID on behalf of a customer from the merchant backend, burns TrxID in live mode, transitions to SUBMITTED, and dispatches Telegram notification.
      operationId: submitPaymentTrx
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trx_id]
              properties:
                trx_id:
                  type: string
                  example: 9K3L2M1ABC
                sender_number:
                  type: string
                  example: 01712345678
      responses:
        '200':
          description: Payment submitted for verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /c/{id}/data:
    get:
      summary: Get public checkout session data
      description: Returns store branding, assigned wallet number, amount, and allowed methods for the hosted or embedded checkout interface.
      operationId: getPublicCheckoutData
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public checkout session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionData'
        '404':
          $ref: '#/components/responses/NotFound'

  /c/{id}/method:
    post:
      summary: Select payment method from checkout page
      operationId: selectPublicPaymentMethod
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  $ref: '#/components/schemas/PaymentMethod'
      responses:
        '200':
          description: Method chosen, wallet assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  method:
                    $ref: '#/components/schemas/PaymentMethod'
                  status:
                    type: string
                  assigned_wallet:
                    $ref: '#/components/schemas/AssignedWallet'
        '400':
          $ref: '#/components/responses/BadRequest'

  /c/{id}/submit:
    post:
      summary: Customer submits TrxID
      description: Customer submits transaction ID from hosted checkout or custom checkout box.
      operationId: submitPublicPaymentDetails
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trx_id]
              properties:
                trx_id:
                  type: string
                  example: 9K3L2M1ABC
                sender_number:
                  type: string
                  example: 01712345678
                website_url:
                  type: string
                  description: Honeypot field (must remain empty)
      responses:
        '200':
          description: Payment details received
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUBMITTED
                  message:
                    type: string
                  payment_id:
                    type: string
                  redirect_url:
                    type: string
                  attempts_remaining:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'

  /c/{id}/status:
    get:
      summary: Get payment status for checkout/thank-you page
      operationId: getCustomerPaymentStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status of the payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    $ref: '#/components/schemas/PaymentStatus'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API Key prefix `smpg_live_` or `smpg_test_`

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    PaymentMethod:
      type: string
      enum: [cod, bkash, nagad]

    PaymentStatus:
      type: string
      enum: [CREATED, SUBMITTED, CONFIRMED, PAID, REJECTED, EXPIRED, CANCELLED]

    CustomerInfo:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string

    CreatePaymentRequest:
      type: object
      required:
        - amount
        - success_url
      properties:
        amount:
          type: integer
          description: Amount in BDT (whole taka)
          example: 1250
        method:
          $ref: '#/components/schemas/PaymentMethod'
        external_order_id:
          type: string
          example: ORD-1042
        customer:
          $ref: '#/components/schemas/CustomerInfo'
        success_url:
          type: string
          format: uri
          example: https://shop.example/orders/ORD-1042/thanks
        cancel_url:
          type: string
          format: uri
          example: https://shop.example/cart
        metadata:
          type: object
          additionalProperties: true

    AssignedWallet:
      type: object
      required: [id, provider, number]
      properties:
        id:
          type: string
          example: wal_bkash_main
        provider:
          $ref: '#/components/schemas/PaymentMethod'
        number:
          type: string
          example: 01785863769
        label:
          type: string
          nullable: true
          example: Main Personal

    Payment:
      type: object
      required:
        - id
        - amount
        - status
        - success_url
        - expires_at
        - created_at
      properties:
        id:
          type: string
          example: pay_8f2k
        merchant_id:
          type: string
        mode:
          type: string
          enum: [test, live]
        external_order_id:
          type: string
        method:
          $ref: '#/components/schemas/PaymentMethod'
        wallet_id:
          type: string
        assigned_wallet:
          $ref: '#/components/schemas/AssignedWallet'
        available_methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        amount:
          type: integer
          example: 1250
        status:
          $ref: '#/components/schemas/PaymentStatus'
        trx_id:
          type: string
        sender_number:
          type: string
        customer_name:
          type: string
        customer_phone:
          type: string
        checkout_url:
          type: string
          format: uri
        success_url:
          type: string
          format: uri
        cancel_url:
          type: string
          format: uri
        metadata:
          type: object
        pending_decision:
          type: string
          enum: [approve, reject, confirm, cancel]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CheckoutSessionData:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
        currency:
          type: string
          example: BDT
        external_order_id:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        store:
          type: object
          properties:
            name:
              type: string
            brand_color:
              type: string
            logo_key:
              type: string
              nullable: true
        available_methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        method:
          $ref: '#/components/schemas/PaymentMethod'
        assigned_wallet:
          $ref: '#/components/schemas/AssignedWallet'
        trx_id:
          type: string
        sender_number:
          type: string
        attempts:
          type: integer
        attempts_remaining:
          type: integer
        expires_at:
          type: string
          format: date-time
        is_expired:
          type: boolean
        can_late_submit:
          type: boolean
        success_url:
          type: string
        cancel_url:
          type: string

    WebhookEvent:
      type: object
      required: [id, type, created, data]
      properties:
        id:
          type: string
          example: evt_8192abc
        type:
          type: string
          enum:
            - payment.created
            - payment.submitted
            - payment.confirmed
            - payment.paid
            - payment.rejected
            - payment.reopened
            - payment.expired
            - payment.cancelled
        created:
          type: integer
          description: Unix timestamp
        data:
          $ref: '#/components/schemas/Payment'

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            param:
              type: string
